databases:
  - name: subnexa-db
    plan: free
    databaseName: subnexa
    user: subnexa
    region: singapore

services:
  - type: web
    name: subnexa-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.seed && gunicorn 'backend.app:create_app()' --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: subnexa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: 3600
      - key: FLASK_DEBUG
        value: 0
      - key: FRONTEND_URL
        fromService:
          name: subnexa-web
          type: web
          envVarKey: PUBLIC_FRONTEND_HOST
      - key: API_EXTERNAL_HOST
        fromService:
          name: subnexa-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false

  - type: web
    runtime: static
    name: subnexa-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: subnexa-api
          type: web
          envVarKey: API_EXTERNAL_HOST
      - key: NODE_VERSION
        value: 24.13.0
      - key: PUBLIC_FRONTEND_HOST
        fromService:
          name: subnexa-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
